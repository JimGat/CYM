name: Deploy Web Flasher

# Deploys the shared flasher and all supported release-board artifacts.
on:
  push:
    branches: [main, master]
    paths:
      - "ESP32C5/docs/index.html"
      - "ESP32C5/docs/manifest*.json"
      - "ESP32C5/binaries-esp32c5/*.bin"
      - "ESP32C5/binaries-ws-c5-28/*.bin"
      - "ESP32C5/binaries-pancake-c5/*.bin"
      - "ESP32C5/binaries-ws-c5-35/*.bin"
      - "ESP32/docs/manifest.cyd-2432s028.json"
      - "ESP32/binaries-cyd-2432s028/*.bin"
      - "ESP32S3/docs/manifest.hosyond-s3-35.json"
      - "ESP32S3/binaries-hosyond-s3-35/*.bin"
      - ".github/workflows/deploy-flasher.yml"
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact independently verified Jimgat_Dev commit (beta dispatch only)
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Verify beta dispatch authorization
        if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          test "$GITHUB_REF" = "refs/heads/Jimgat_Dev"
          test "$GITHUB_SHA" = "$EXPECTED_SHA"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout stable assets
        uses: actions/checkout@v4
        with:
          ref: main
          path: stable-site

      - name: Build and verify site
        working-directory: stable-site
        run: |
          mkdir -p _site/binaries-esp32c5 _site/binaries-ws-c5-28 _site/binaries-pancake-c5 _site/binaries-ws-c5-35 _site/binaries-cyd-2432s028 _site/binaries-hosyond-s3-35
          cp ESP32C5/docs/index.html _site/index.html
          sed 's|"\.\./binaries-esp32c5/|"binaries-esp32c5/|g' ESP32C5/docs/manifest.json > _site/manifest.json
          sed 's|"\.\./binaries-ws-c5-28/|"binaries-ws-c5-28/|g' ESP32C5/docs/manifest.ws-c5-28.json > _site/manifest.ws-c5-28.json
          sed 's|"\.\./binaries-pancake-c5/|"binaries-pancake-c5/|g' ESP32C5/docs/manifest.pancake-c5.json > _site/manifest.pancake-c5.json
          sed 's|"\.\./binaries-ws-c5-35/|"binaries-ws-c5-35/|g' ESP32C5/docs/manifest.ws-c5-35.json > _site/manifest.ws-c5-35.json
          sed 's|"\.\./binaries-cyd-2432s028/|"binaries-cyd-2432s028/|g' ESP32/docs/manifest.cyd-2432s028.json > _site/manifest.cyd-2432s028.json
          sed 's|"\.\./binaries-hosyond-s3-35/|"binaries-hosyond-s3-35/|g' ESP32S3/docs/manifest.hosyond-s3-35.json > _site/manifest.hosyond-s3-35.json
          cp ESP32C5/binaries-esp32c5/*.bin _site/binaries-esp32c5/
          cp ESP32C5/binaries-ws-c5-28/*.bin _site/binaries-ws-c5-28/
          cp ESP32C5/binaries-pancake-c5/*.bin _site/binaries-pancake-c5/
          cp ESP32C5/binaries-ws-c5-35/*.bin _site/binaries-ws-c5-35/
          cp ESP32/binaries-cyd-2432s028/*.bin _site/binaries-cyd-2432s028/
          cp ESP32S3/binaries-hosyond-s3-35/*.bin _site/binaries-hosyond-s3-35/
          for f in ESP32C5/docs/*.png ESP32C5/docs/*.jpg ESP32C5/docs/*.gif ESP32C5/docs/*.svg ESP32C5/docs/*.ico; do
            [ -f "$f" ] && cp "$f" _site/
          done
          test -s _site/index.html
          test -s _site/manifest.json
          test -s _site/manifest.ws-c5-28.json
          test -s _site/manifest.pancake-c5.json
          test -s _site/manifest.ws-c5-35.json
          test -s _site/manifest.cyd-2432s028.json
          test -s _site/manifest.hosyond-s3-35.json
          for manifest in _site/manifest.json _site/manifest.ws-c5-28.json _site/manifest.pancake-c5.json _site/manifest.ws-c5-35.json _site/manifest.cyd-2432s028.json _site/manifest.hosyond-s3-35.json; do
            python3 -m json.tool "$manifest" >/dev/null
          done
          test -s _site/binaries-esp32c5/CYM-NM28C5.bin
          test -s _site/binaries-esp32c5/CYM-NM28C5-full.bin
          test -s _site/binaries-ws-c5-28/CYM-WS-C5-28.bin
          test -s _site/binaries-ws-c5-28/CYM-WS-C5-28-full.bin
          test -s _site/binaries-pancake-c5/CYM-Pancake-C5.bin
          test -s _site/binaries-pancake-c5/CYM-Pancake-C5-full.bin
          test -s _site/binaries-ws-c5-35/CYM-WS-C5-35.bin
          test -s _site/binaries-ws-c5-35/CYM-WS-C5-35-full.bin
          test -s _site/binaries-cyd-2432s028/CYM-CYD-2432S028.bin
          test -s _site/binaries-cyd-2432s028/CYM-CYD-2432S028-full.bin
          test -s _site/binaries-hosyond-s3-35/CYM-hosyond-s3-35.bin
          test -s _site/binaries-hosyond-s3-35/CYM-hosyond-s3-35-full.bin
          echo "--- site contents ---"
          find _site -type f | sort

      - name: Add isolated Beta flasher UI
        run: |
          cp -a stable-site/_site _site
          mkdir -p _site/beta
          cp -a stable-site/_site/. _site/beta/
          cp ESP32C5/docs/index.html _site/beta/index.html
          mkdir -p _site/beta/binaries-ws-s3-5b
          cp ESP32S3/binaries-ws-s3-5b/*.bin _site/beta/binaries-ws-s3-5b/
          python3 - <<"PY"
          import json
          from pathlib import Path
          m = json.loads(Path("ESP32S3/docs/manifest.ws-s3-5b.json").read_text())
          for part in m["parts"]:
              part["path"] = part["path"].removeprefix("../")
              assert Path("_site/beta", part["path"]).is_file()
          Path("_site/beta/manifest.ws-s3-5b.json").write_text(json.dumps(m, indent=2) + "\n")
          PY
          test -s _site/beta/index.html
          python3 - <<'PY'
          from pathlib import Path
          page = Path('_site/beta/index.html')
          text = page.read_text()
          text = text.replace('const betaUnlock = urlParams.get("beta") === "1";',
                              'const betaUnlock = true; // isolated Beta deployment')
          assert '"hackerbox-cyd"' in text
          import os, re
          sha = os.environ['GITHUB_SHA']
          assert re.fullmatch(r'[0-9a-f]{40}', sha)
          old = 'const BRANCH = { stable: "main", dev: "Jimgat_Dev" };'
          assert text.count(old) == 1
          text = text.replace(old, 'const BRANCH = { stable: "main", dev: "' + sha + '" };')
          text = text.replace('binaries fetched live from the <code>Jimgat_Dev</code> branch.',
                              'binaries pinned to verified development commit <code>' + sha + '</code>.')
          page.write_text(text)
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
