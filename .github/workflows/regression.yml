name: Portable regression review
on:
  pull_request:
    branches: [Jimgat_Dev, main]
  push:
    branches: [Jimgat_Dev]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  portable:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out reviewed code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run portable structural and mocked-host gates
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -B tests/run_regression.py --suite portable --output "${RUNNER_TEMP}/cym-regression"
      - name: Upload bounded public gate reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: portable-regression-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/cym-regression/results.json
            ${{ runner.temp }}/cym-regression/dependency-provenance.json
            ${{ runner.temp }}/cym-regression/*/unittest.json
            ${{ runner.temp }}/cym-regression/*/run.log
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6
